[project]
name = "pitdata"
version = "0.1.0"
description = "Point-in-time market data platform"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "pyarrow",
    "pandas",
    "requests",
    "typer",
    "pandas-market-calendars>=5.6",
]

[project.scripts]
pit = "pitdata.cli:app"

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitdata"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ (flake8-datetimez) flags naive datetimes, enforcing "UTC everywhere" at lint time.
extend-select = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
